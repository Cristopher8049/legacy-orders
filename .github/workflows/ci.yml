name: CI - Node.js Test

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

permissions:
  contents: read

jobs:
  test:
    name: Run tests and package app
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js 20
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Run tests
        run: npm test

      - name: Package application
        if: success()
        run: |
          tar -czf /tmp/legacy-app.tar.gz . \
            --exclude=.git \
            --exclude=node_modules \
            --exclude=legacy-app.tar.gz

      - name: Upload artifact
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: legacy-app-package
          path: /tmp/legacy-app.tar.gz
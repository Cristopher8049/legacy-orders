name: CI

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Run tests
        run: npm test

      - name: Package application
        if: success()
        run: |
          tar -czf app-package.tar.gz . --exclude=.git --exclude=node_modules

      - name: Upload artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-package
          path: app-package.tar.gz